[project]
name = "latency-benchmark"
version = "0.1.0"
description = "Latency benchmark: autoregressive vs diffusion text models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "google-genai>=2.10.0",
    "hatchling>=1.30.1",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyttsx3>=2.99",
    "rich>=15.0.0",
    "torch>=2.12.1",
    "transformers>=4.52",
    "typer>=0.26.8",
]

[project.scripts]
benchmark = "latency_benchmark.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latency_benchmark"]
